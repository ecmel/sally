# The iOS app, generated into build/ios by `make ios-project` (XcodeGen).
# The Mac app is built by the Makefile alone.

name: Sally

options:
  bundleIdPrefix: io.github.ecmel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 79P8U57KXZ

targets:
  Sally:
    type: application
    platform: iOS
    sources:
      - path: src
        excludes:
          - mac
          - ios/Info.plist
      - path: build/ios/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ecmel.sally
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: $(SRCROOT)/../../src/ios/Info.plist
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../src
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_ENABLE_OBJC_ARC: YES
        WARNING_CFLAGS: -Wall -Wextra -Wno-unused-parameter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
